<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Featherless</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menu" class="glass icon">☰</button>
    <button id="titleButton" class="chat-title">
      <strong id="chatName">New conversation</strong>
      <span id="modelLabel">DeepSeek V4 Flash 0731 · 32K</span>
    </button>
    <button id="newChat" class="glass icon">＋</button>
  </header>

  <main id="messages" class="messages"></main>

  <div id="typing" class="typing hidden"><i></i><i></i><i></i><span>Generando</span></div>

  <div id="trimToast" class="trim-toast" aria-live="polite"></div>
  <div class="context-wrap">
    <div><span id="ctxLabel">0 / 32,768</span><span id="ctxPct">0%</span></div>
    <div class="ctxbar"><span id="ctxFill"></span></div>
  </div>

  <div id="attachPreview" class="attach-preview hidden"></div>
  <form id="composer">
    <button type="button" id="attach" class="glass mini" title="Adjuntar">＋</button>
    <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.txt,.json,.csv,.md,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log,.csv,text/*" multiple hidden>
    <textarea id="input" rows="1" placeholder="Mensaje…" enterkeyhint="send"></textarea>
    <button type="submit" id="send" class="send">↑</button>
  </form>
</div>

<aside id="drawer">
  <div class="drawer-head">
    <div><small>FEATHERLESS</small><h2>Chat</h2></div>
    <button id="close" class="glass icon">×</button>
  </div>
  <button id="drawerNew" class="hero-btn">＋ Nuevo chat</button>
  <div class="drawer-section">
    <div class="section-title">CONVERSACIONES</div>
    <div id="conversationList"></div>
    <button id="saveConversation" class="menu-row">⌄ Guardar conversación</button>
    <button id="importJSON" class="menu-row">⇧ Importar JSON</button><input id="jsonFile" type="file" accept="application/json,.json" hidden><button id="export" class="menu-row">⇩ Exportar JSON</button>
  </div>
  <div class="drawer-section">
    <div class="section-title">MODELO</div>
    <label class="api">Modelo (ID)
      <input id="model" type="text" list="modelList" placeholder="org/model-name" autocomplete="off">
      <datalist id="modelList"></datalist>
    </label>
    <div class="setting-grid">
      <label>Contexto<input value="32,768" readonly></label>
      <label>Max output<input id="maxTokens" type="number" min="1" value="1200"></label>
      <label>Temperature<input id="temperature" type="number" min="0" max="2" step=".05" value=".8"></label>
      <label class="toggle-row">Thinking<input id="thinking" type="checkbox"><b></b></label>
    </div>
  </div>
  <div class="drawer-section">
    <div class="section-title">PERSONALIZACIÓN</div>
    <button id="system" class="menu-row">⌘ System prompt <span>›</span></button>
    <button id="stats" class="menu-row">⌁ Estadísticas <span>›</span></button>
    <label class="api">API key<input id="apiKey" type="password" placeholder="sk-…"></label>
    <p class="privacy">La clave se guarda solo en este dispositivo (localStorage). No se envía a ningún servidor nuestro. Funciona 100% desde el iPhone sin Termux ni PC.</p>
  </div>
  <div class="drawer-footer">Featherless Web · OLED edition</div>
</aside>
<div id="scrim"></div>

<dialog id="dialog">
  <div class="dialog-head"><strong id="dialogTitle"></strong><button class="glass icon" data-close>×</button></div>
  <div id="dialogBody"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
